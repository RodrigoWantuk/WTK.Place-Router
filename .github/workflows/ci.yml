name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore PlaceRouter.sln
      - run: dotnet build PlaceRouter.sln --configuration Release --no-restore
      - run: dotnet test PlaceRouter.sln --configuration Release --no-build
